<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV Pro | بث مباشر</title>
<link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --main-color: #e10600;
  --main-hover: #ff1a00;
  --bg-color: #0a0a0a;
  --card-bg: #16161a;
  --border: #2a2a2f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-color);
  color: white;
  font-family: 'Cairo', sans-serif;
  margin: 0;
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(225,6,0,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(225,6,0,0.05) 0%, transparent 50%);
}
header {
  background: linear-gradient(135deg, var(--main-color), #8b0000);
  padding: 1.2rem;
  text-align: center;
  box-shadow: 0 4px 20px rgba(225,6,0,0.4);
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.3);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 1px;
}
.live-dot {
  width: 8px;
  height: 8px;
  background: #fff;
  border-radius: 50%;
  animation: blink 1.2s infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; box-shadow: 0 0 8px #fff; }
  50% { opacity: 0.3; box-shadow: 0 0 2px #fff; }
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}

#video-container {
  width: 100%;
  max-width: 900px;
  background: black;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(225,6,0,0.4);
  margin-bottom: 30px;
  position: relative;
}
#video-container::before {
  content: '';
  position: absolute;
  inset: -2px;
  background: linear-gradient(45deg, var(--main-color), transparent, var(--main-color));
  border-radius: 16px;
  z-index: -1;
  opacity: 0.5;
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

.video-js {
  width: 100% !important;
  height: auto !important;
  aspect-ratio: 16/9;
}
.video-js .vjs-big-play-button {
  border-color: var(--main-color) !important;
  background-color: rgba(225,6,0,0.7) !important;
  border-radius: 50% !important;
  width: 80px !important;
  height: 80px !important;
  line-height: 80px !important;
  top: 50% !important;
  left: 50% !important;
  transform: translate(-50%, -50%) !important;
  margin: 0 !important;
}
.video-js .vjs-control-bar {
  background: linear-gradient(transparent, rgba(0,0,0,0.9)) !important;
  height: 4em !important;
}
.video-js .vjs-play-progress {
  background: var(--main-color) !important;
}

.now-playing {
  width: 100%;
  max-width: 900px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 12px 20px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.now-playing-info {
  display: flex;
  align-items: center;
  gap: 12px;
}
.now-playing-label {
  font-size: 0.75rem;
  color: #888;
  font-family: monospace;
  letter-spacing: 1px;
}
.now-playing-name {
  font-size: 1.1rem;
  font-weight: 800;
  color: #fff;
}
.live-tag {
  background: var(--main-color);
  color: #fff;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 1px;
  animation: blink 1.5s infinite;
}

.stats-bar {
  width: 100%;
  max-width: 900px;
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  font-size: 0.85rem;
  color: #888;
  font-family: monospace;
}
.stats-bar strong { color: var(--main-color); }

.section-title {
  width: 100%;
  max-width: 1000px;
  font-size: 1.1rem;
  font-weight: 800;
  margin-bottom: 16px;
  padding-right: 6px;
  border-right: 4px solid var(--main-color);
  padding-right: 14px;
}

.categories {
  width: 100%;
  max-width: 1000px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.cat-btn {
  background: var(--card-bg);
  border: 1px solid var(--border);
  color: #aaa;
  padding: 8px 18px;
  border-radius: 25px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  transition: all 0.3s;
}
.cat-btn:hover {
  color: #fff;
  border-color: var(--main-color);
}
.cat-btn.active {
  background: var(--main-color);
  color: #fff;
  border-color: var(--main-color);
  box-shadow: 0 4px 15px rgba(225,6,0,0.4);
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 15px;
  width: 100%;
  max-width: 1000px;
}
.channel-card {
  background: var(--card-bg);
  padding: 16px 12px;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.channel-card:hover {
  transform: translateY(-5px);
  border-color: var(--main-color);
  background: #1f1f24;
  box-shadow: 0 10px 30px rgba(225,6,0,0.3);
}
.channel-card.playing {
  border-color: var(--main-color);
  background: linear-gradient(135deg, rgba(225,6,0,0.15), transparent);
}
.channel-card.playing::before {
  content: '🔴 LIVE';
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--main-color);
  color: #fff;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.6rem;
  font-weight: 800;
}
.channel-card img {
  width: 60px;
  height: 60px;
  object-fit: contain;
  margin-bottom: 10px;
  border-radius: 8px;
}
.channel-card .placeholder-logo {
  width: 60px;
  height: 60px;
  margin: 0 auto 10px;
  background: linear-gradient(135deg, #333, #1a1a1a);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
}
.channel-card p {
  margin: 0;
  font-size: 0.88rem;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.channel-card .cat-name {
  font-size: 0.7rem;
  color: #888;
  margin-top: 4px;
  font-family: monospace;
}

.empty {
  width: 100%;
  max-width: 1000px;
  text-align: center;
  padding: 60px 20px;
  color: #666;
}
.empty-icon {
  font-size: 4rem;
  opacity: 0.3;
  margin-bottom: 16px;
}

/* Loading */
#loader {
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  transition: opacity 0.6s;
}
#loader.hide { opacity: 0; pointer-events: none; }
.loader-logo {
  width: 70px;
  height: 70px;
  border: 3px solid var(--main-color);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text {
  color: var(--main-color);
  font-family: monospace;
  font-size: 0.9rem;
  letter-spacing: 3px;
  animation: blink 1.2s infinite;
}

@media (max-width: 600px) {
  header h1 { font-size: 1.2rem; }
  .channels-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .channel-card { padding: 12px 8px; }
  .channel-card img, .channel-card .placeholder-logo { width: 50px; height: 50px; }
  .channel-card p { font-size: 0.8rem; }
  .container { padding: 12px; }
  .now-playing { padding: 10px 14px; }
  .now-playing-name { font-size: 0.95rem; }
}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-logo"></div>
  <div class="loader-text">CONNECTING TO STREAM...</div>
</div>

<header>
  <h1>
    <span>📺</span>
    <span>LIVE TV PRO</span>
    <span class="live-badge">
      <span class="live-dot"></span>
      <span id="liveCount">LIVE</span>
    </span>
  </h1>
</header>

<div class="container">

  <div class="now-playing">
    <div class="now-playing-info">
      <div>
        <div class="now-playing-label">NOW PLAYING</div>
        <div class="now-playing-name" id="nowPlayingName">اختر قناة للبدء</div>
      </div>
    </div>
    <div class="live-tag" id="liveTag" style="display:none;">🔴 LIVE</div>
  </div>

  <div id="video-container">
    <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto" playsinline>
      <p class="vjs-no-js">المتصفح لا يدعم تشغيل الفيديو</p>
    </video>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="section-title">📡 القنوات المتاحة</div>

  <div class="categories" id="categories"></div>

  <div class="channels-grid" id="channelsList">
    <div class="empty" style="grid-column: 1/-1;">
      <div class="empty-icon">📡</div>
      <div>جاري تحميل القنوات...</div>
    </div>
  </div>

</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDM0kNaNhlmqWuzgl8S6ZEKYsIygPblEB0",
  authDomain: "intelligence-db.firebaseapp.com",
  projectId: "intelligence-db",
  storageBucket: "intelligence-db.firebasestorage.app",
  messagingSenderId: "522063872850",
  appId: "1:522063872850:web:aea535752f5838a46db08b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let player = null;
let hls = null;
let allChannels = [];
let currentCat = 'all';
let currentChannelId = null;

const $ = id => document.getElementById(id);

function escapeHTML(v) {
  return String(v ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* ====== Init Player ====== */
function initPlayer() {
  player = videojs('my-video', {
    fluid: true,
    responsive: true,
    html5: {
      vhs: { overrideNative: true },
      nativeAudioTracks: false,
      nativeVideoTracks: false
    }
  });

  player.on('error', () => {
    const err = player.error();
    if (err) {
      $('nowPlayingName').textContent = '⚠️ تعذر تحميل البث';
    }
  });
}

/* ====== Load Channels ====== */
async function loadChannels() {
  try {
    const snap = await getDocs(collection(db, "channels"));
    allChannels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allChannels.sort((a, b) => (a.order || 0) - (b.order || 0));
    renderStats();
    renderCategories();
    renderGrid(allChannels);
    setTimeout(() => $('loader').classList.add('hide'), 600);
  } catch (e) {
    console.error(e);
    $('loader').classList.add('hide');
    $('channelsList').innerHTML = `
      <div class="empty" style="grid-column: 1/-1;">
        <div class="empty-icon">⚠️</div>
        <div>خطأ في تحميل القنوات</div>
        <div style="font-size:0.75rem; margin-top:8px; color:#e10600;">${escapeHTML(e.message)}</div>
      </div>
    `;
  }
}

function renderStats() {
  const cats = new Set(allChannels.map(c => c.category).filter(Boolean));
  $('liveCount').textContent = allChannels.length + ' LIVE';
  $('statsBar').innerHTML = `
    <span>📡 قنوات: <strong>${allChannels.length}</strong></span>
    <span>📂 تصنيفات: <strong>${cats.size}</strong></span>
    <span>🔴 بث مباشر: <strong>${allChannels.length}</strong></span>
  `;
}

function renderCategories() {
  const cats = ['all', ...new Set(allChannels.map(c => c.category).filter(Boolean))];
  $('categories').innerHTML = cats.map(c => {
    const label = c === 'all' ? '📁 الكل' : escapeHTML(c);
    return `<button type="button" class="cat-btn ${c === currentCat ? 'active' : ''}" data-cat="${escapeHTML(c)}">${label}</button>`;
  }).join('');
}

function renderGrid(data) {
  const grid = $('channelsList');
  if (!data.length) {
    grid.innerHTML = `
      <div class="empty" style="grid-column: 1/-1;">
        <div class="empty-icon">📭</div>
        <div>لا توجد قنوات</div>
      </div>
    `;
    return;
  }
  grid.innerHTML = data.map(c => {
    const logo = c.logo
      ? `<img src="${escapeHTML(c.logo)}" alt="${escapeHTML(c.name)}" onerror="this.outerHTML='<div class=\\'placeholder-logo\\'>📺</div>'">`
      : `<div class="placeholder-logo">📺</div>`;
    const isPlaying = c.id === currentChannelId ? ' playing' : '';
    return `
      <div class="channel-card${isPlaying}" data-channel-id="${escapeHTML(c.id)}">
        ${logo}
        <p>${escapeHTML(c.name || 'قناة')}</p>
        <div class="cat-name">${escapeHTML(c.category || 'عام')}</div>
      </div>
    `;
  }).join('');
}

function filterChannels() {
  const q = ($('searchInput')?.value || '').toLowerCase().trim();
  const filtered = allChannels.filter(c => {
    const matchCat = currentCat === 'all' || c.category === currentCat;
    if (!matchCat) return false;
    if (!q) return true;
    return `${c.name || ''} ${c.category || ''}`.toLowerCase().includes(q);
  });
  renderGrid(filtered);
}

/* ====== Play Channel ====== */
function playChannel(id) {
  const ch = allChannels.find(c => c.id === id);
  if (!ch) return;

  currentChannelId = id;
  $('nowPlayingName').textContent = ch.name || 'قناة';
  $('liveTag').style.display = 'inline-block';

  // destroy previous hls
  if (hls) {
    try { hls.destroy(); } catch(e) {}
    hls = null;
  }

  const url = ch.url || '';
  if (!url) {
    $('nowPlayingName').textContent = '⚠️ لا يوجد رابط بث';
    return;
  }

  // YouTube
  if (url.includes('youtube.com') || url.includes('youtu.be')) {
    let videoId = '';
    try {
      const u = new URL(url);
      if (u.hostname.includes('youtu.be')) {
        videoId = u.pathname.slice(1).split('?')[0];
      } else {
        videoId = u.searchParams.get('v') || u.pathname.split('/').pop();
      }
    } catch(e) {}
    if (videoId) {
      player.pause();
      player.src({ type: 'video/youtube', src: `https://www.youtube.com/watch?v=${videoId}` });
      player.play();
      renderGrid(filterChannelsReturn());
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
  }

  // Twitch
  if (url.includes('twitch.tv')) {
    $('nowPlayingName').textContent = '⚠️ استخدم الرابط من صفحة Twitch';
    return;
  }

  // m3u8 / direct
  if (url.includes('.m3u8')) {
    if (window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({
        lowLatencyMode: true,
        enableWorker: true,
        maxBufferLength: 30
      });
      hls.loadSource(url);
      hls.attachMedia(player.el().querySelector('video'));
      hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
        player.play().catch(err => console.log('autoplay blocked:', err));
      });
      hls.on(window.Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          $('nowPlayingName').textContent = '⚠️ تعذر تحميل البث';
        }
      });
    } else if (player.el().querySelector('video').canPlayType('application/vnd.apple.mpegurl')) {
      player.src({ type: 'application/x-mpegURL', src: url });
      player.play().catch(err => console.log(err));
    } else {
      $('nowPlayingName').textContent = '⚠️ المتصفح لا يدعم هذا البث';
    }
  } else {
    player.src({ src: url, type: 'video/mp4' });
    player.play().catch(err => console.log(err));
  }

  renderGrid(filterChannelsReturn());
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function filterChannelsReturn() {
  const q = ($('searchInput')?.value || '').toLowerCase().trim();
  return allChannels.filter(c => {
    const matchCat = currentCat === 'all' || c.category === currentCat;
    if (!matchCat) return false;
    if (!q) return true;
    return `${c.name || ''} ${c.category || ''}`.toLowerCase().includes(q);
  });
}

/* ====== Events ====== */
$('categories')?.addEventListener('click', e => {
  const btn = e.target.closest('button[data-cat]');
  if (!btn) return;
  currentCat = btn.dataset.cat;
  renderCategories();
  renderGrid(filterChannelsReturn());
});

$('channelsList')?.addEventListener('click', e => {
  const card = e.target.closest('[data-channel-id]');
  if (!card) return;
  playChannel(card.dataset.channelId);
});

/* ====== Init ====== */
initPlayer();
loadChannels();
</script>

</body>
</html>
