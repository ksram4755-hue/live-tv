<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | LIVE TV PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --main-color: #e10600;
  --main-hover: #ff1a00;
  --bg-color: #0a0a0a;
  --card-bg: #16161a;
  --card-hover: #1f1f24;
  --border: #2a2a2f;
  --green: #059669;
  --text: #f8fafc;
  --dim: #888;
  --dim2: #666;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-color);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(225,6,0,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(225,6,0,0.05) 0%, transparent 50%);
}

/* ===== Header ===== */
header {
  background: linear-gradient(135deg, var(--main-color), #8b0000);
  padding: 1.2rem;
  text-align: center;
  box-shadow: 0 4px 20px rgba(225,6,0,0.4);
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.admin-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.3);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 1px;
}

/* ===== Login Screen ===== */
.login-screen {
  min-height: calc(100vh - 100px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-screen.hidden { display: none; }
.login-box {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-top: 4px solid var(--main-color);
  border-radius: 16px;
  padding: 40px 32px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.login-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  background: linear-gradient(135deg, var(--main-color), #8b0000);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  box-shadow: 0 0 40px rgba(225,6,0,0.5);
}
.login-box h2 {
  text-align: center;
  color: #fff;
  font-size: 1.3rem;
  margin-bottom: 6px;
}
.login-box .sub {
  text-align: center;
  color: var(--dim);
  font-size: 0.72rem;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 3px;
  margin-bottom: 28px;
}

/* ===== Form Elements ===== */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 0.82rem;
  color: var(--dim);
  font-weight: 700;
  margin-bottom: 6px;
}
.field input, .field textarea, .field select {
  width: 100%;
  background: var(--bg-color);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: #fff;
  font-family: inherit;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none;
  border-color: var(--main-color);
  box-shadow: 0 0 0 3px rgba(225,6,0,0.15);
}
.field textarea { resize: vertical; min-height: 70px; }

.btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--main-color), #b00500);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-weight: 800;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(225,6,0,0.4); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-green { background: linear-gradient(135deg, #059669, #10b981); }
.btn-gray { background: var(--border); }
.btn-red { background: #b91c1c; }
.btn-mini {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.75rem;
  font-weight: 700;
  transition: all 0.2s;
  width: auto;
}

/* ===== Container ===== */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px;
}

/* ===== User Bar ===== */
.user-bar {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}
.user-bar-info {
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-bar-dot {
  width: 10px;
  height: 10px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--green);
  animation: blink 1.5s infinite;
}
@keyframes blink { 50% { opacity: 0.4; } }
.user-bar-email {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  color: var(--dim);
}
.btn-logout {
  background: transparent;
  border: 1px solid var(--main-color);
  color: var(--main-color);
  padding: 8px 16px;
  border-radius: 8px;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-logout:hover {
  background: var(--main-color);
  color: #fff;
}

/* ===== Stats ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}
.stat::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 3px;
  height: 100%;
  background: var(--main-color);
}
.stat:hover {
  transform: translateY(-3px);
  border-color: var(--main-color);
  box-shadow: 0 8px 25px rgba(225,6,0,0.2);
}
.stat-value {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--main-color);
  font-family: 'JetBrains Mono', monospace;
}
.stat-label {
  font-size: 0.75rem;
  color: var(--dim);
  font-weight: 700;
  margin-top: 4px;
}

/* ===== Actions ===== */
.actions {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.actions .btn {
  width: auto;
  padding: 12px 22px;
  font-size: 0.88rem;
}

/* ===== Search ===== */
.search-bar {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
  color: #fff;
  font-family: inherit;
  margin-bottom: 20px;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.search-bar:focus {
  outline: none;
  border-color: var(--main-color);
  box-shadow: 0 0 0 3px rgba(225,6,0,0.15);
}

/* ===== Channels Grid ===== */
.channels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.channel-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.channel-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 3px;
  height: 100%;
  background: var(--main-color);
  transition: width 0.3s;
}
.channel-card:hover {
  transform: translateY(-3px);
  border-color: var(--main-color);
  box-shadow: 0 10px 30px rgba(225,6,0,0.2);
}
.channel-card:hover::before { width: 5px; }
.channel-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.channel-logo {
  width: 50px;
  height: 50px;
  border-radius: 10px;
  background: #000;
  border: 1px solid var(--border);
  object-fit: contain;
  padding: 4px;
  flex-shrink: 0;
}
.channel-logo-placeholder {
  width: 50px;
  height: 50px;
  border-radius: 10px;
  background: linear-gradient(135deg, #333, #1a1a1a);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  flex-shrink: 0;
}
.channel-info { flex: 1; min-width: 0; }
.channel-name {
  font-size: 1rem;
  font-weight: 800;
  color: #fff;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.channel-cat {
  font-size: 0.72rem;
  color: var(--dim);
  font-family: 'JetBrains Mono', monospace;
}
.channel-url {
  font-size: 0.75rem;
  color: var(--dim2);
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg-color);
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border: 1px solid var(--border);
}
.channel-actions {
  display: flex;
  gap: 8px;
}
.channel-actions .btn-mini { flex: 1; }
.btn-edit {
  color: var(--main-color);
  border-color: var(--main-color);
}
.btn-edit:hover { background: var(--main-color); color: #fff; }
.btn-del {
  color: #dc2626;
  border-color: #dc2626;
}
.btn-del:hover { background: #dc2626; color: #fff; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-top: 4px solid var(--main-color);
  border-radius: 16px;
  max-width: 640px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 30px 80px rgba(225,6,0,0.3);
}
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--card-bg);
  z-index: 2;
}
.modal-header h3 {
  font-size: 1.1rem;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}
.close-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  width: 34px;
  height: 34px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
}
.close-btn:hover {
  background: var(--main-color);
  border-color: var(--main-color);
}
.modal-body { padding: 22px; }

/* ===== Empty ===== */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--dim);
  grid-column: 1/-1;
}
.empty-icon {
  font-size: 4rem;
  opacity: 0.3;
  margin-bottom: 12px;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card-bg);
  border: 1px solid var(--green);
  color: #fff;
  padding: 14px 24px;
  border-radius: 10px;
  font-weight: 700;
  z-index: 9999;
  display: none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.toast.error { border-color: var(--main-color); }

/* ===== Loader ===== */
#loader {
  position: fixed;
  inset: 0;
  background: var(--bg-color);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  transition: opacity 0.6s;
}
#loader.hide { opacity: 0; pointer-events: none; }
.loader-logo {
  width: 70px;
  height: 70px;
  border: 3px solid var(--main-color);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text {
  color: var(--main-color);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9rem;
  letter-spacing: 3px;
  animation: blink 1.2s infinite;
}

@media (max-width: 600px) {
  header h1 { font-size: 1.1rem; }
  .container { padding: 16px 12px; }
  .channels-grid { grid-template-columns: 1fr; }
  .login-box { padding: 30px 20px; }
  .stat-value { font-size: 1.4rem; }
}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-logo"></div>
  <div class="loader-text">LOADING ADMIN PANEL...</div>
</div>

<header>
  <h1>
    <span>📺</span>
    <span>LIVE TV PRO</span>
    <span class="admin-badge">🔐 ADMIN</span>
  </h1>
</header>

<!-- ===== Login ===== -->
<div class="login-screen" id="loginScreen" style="display:none;">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h2>لوحة تحكم القنوات</h2>
    <div class="sub">ADMIN ACCESS ONLY</div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">🔓 تسجيل الدخول</button>
    <div class="toast error" id="loginError" style="position:static; display:none; margin-top:12px; transform:none; border-color:var(--main-color);"></div>
  </div>
</div>

<!-- ===== Admin Panel ===== -->
<div class="admin-panel" id="adminPanel" style="display:none;">
  <div class="container">
    <div class="user-bar">
      <div class="user-bar-info">
        <span class="user-bar-dot"></span>
        <span class="user-bar-email" id="userEmail"></span>
      </div>
      <button class="btn-logout" id="logoutBtn">🚪 تسجيل خروج</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="actions">
      <button class="btn btn-green" id="addBtn">➕ إضافة قناة جديدة</button>
      <button class="btn btn-gray" id="refreshBtn" style="width:auto;">🔄 تحديث</button>
    </div>

    <input type="text" class="search-bar" id="adminSearch" placeholder="🔍 ابحث عن قناة...">

    <div class="channels-grid" id="channelsGrid"></div>
  </div>
</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="formTitle">➕ إضافة قناة جديدة</h3>
      <button class="close-btn" id="closeFormBtn">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">

      <div class="field">
        <label>اسم القناة *</label>
        <input type="text" id="f_name" placeholder="مثال: beIN Sports 1" list="nameSuggestions">
        <datalist id="nameSuggestions">
          <option value="beIN Sports 1">
          <option value="beIN Sports 2">
          <option value="MBC مصر">
          <option value="الجزيرة">
          <option value="العربية">
          <option value="Sky News Arabia">
        </datalist>
      </div>

      <div class="field">
        <label>التصنيف</label>
        <input type="text" id="f_category" placeholder="رياضة / أخبار / ترفيه / ديني" list="catSuggestions">
        <datalist id="catSuggestions">
          <option value="رياضة">
          <option value="أخبار">
          <option value="ترفيه">
          <option value="ديني">
          <option value="أفلام">
          <option value="أطفال">
          <option value="وثائقي">
        </datalist>
      </div>

      <div class="field">
        <label>رابط البث * (m3u8 / YouTube Live / Twitch)</label>
        <textarea id="f_url" placeholder="https://example.com/stream.m3u8&#10;أو&#10;https://youtube.com/watch?v=xxxxx"></textarea>
      </div>

      <div class="field">
        <label>رابط الشعار (من imgbb.com - اختياري)</label>
        <input type="text" id="f_logo" placeholder="https://i.ibb.co/...">
      </div>

      <div class="field">
        <label>الترتيب</label>
        <input type="number" id="f_order" placeholder="0" value="0">
      </div>

      <div class="field">
        <label>ملاحظات (اختياري)</label>
        <textarea id="f_notes" placeholder="أي ملاحظات عن القناة..."></textarea>
      </div>

      <button class="btn btn-green" id="saveBtn" style="margin-top:8px;">💾 حفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✓ تم بنجاح</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDM0kNaNhlmqWuzgl8S6ZEKYsIygPblEB0",
  authDomain: "intelligence-db.firebaseapp.com",
  projectId: "intelligence-db",
  storageBucket: "intelligence-db.firebasestorage.app",
  messagingSenderId: "522063872850",
  appId: "1:522063872850:web:aea535752f5838a46db08b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let allChannels = [];
let toastTimer = null;
const $ = id => document.getElementById(id);
function value(id) { return $(id)?.value?.trim() || ""; }
function setValue(id, val = "") { const el = $(id); if (el) el.value = val ?? ""; }

function escapeHTML(v) {
  return String(v ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function validEmail(e) { return !e || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function validURL(u) {
  if (!u) return false;
  try { const x = new URL(u); return x.protocol === "http:" || x.protocol === "https:"; } catch { return false; }
}
function normalize(v) { return String(v ?? "").toLowerCase().trim(); }

function toast(msg, isError = false) {
  const t = $("toast"); if (!t) return;
  clearTimeout(toastTimer);
  t.textContent = msg;
  t.classList.toggle("error", isError);
  t.style.display = "block";
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 3000);
}

/* ===== Auth ===== */
onAuthStateChanged(auth, async user => {
  $('loader').classList.add('hide');
  if (user) {
    $('loginScreen').style.display = 'none';
    $('adminPanel').style.display = 'block';
    if ($('userEmail')) $('userEmail').textContent = '✓ ' + (user.email || 'مسجل دخول');
    await loadChannels();
  } else {
    $('loginScreen').style.display = 'flex';
    $('adminPanel').style.display = 'none';
    allChannels = [];
  }
});

async function doLogin() {
  const email = value("loginEmail");
  const pass = $("loginPass")?.value || "";
  const errBox = $("loginError");
  if (errBox) { errBox.style.display = "none"; errBox.textContent = ""; }
  if (!email || !pass) {
    if (errBox) { errBox.textContent = "⚠️ املأ البريد وكلمة المرور"; errBox.style.display = "block"; }
    return;
  }
  if (!validEmail(email)) {
    if (errBox) { errBox.textContent = "⚠️ البريد غير صحيح"; errBox.style.display = "block"; }
    return;
  }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (error) {
    console.error(error);
    let message = "❌ خطأ في تسجيل الدخول";
    switch (error.code) {
      case "auth/invalid-credential":
      case "auth/wrong-password":
      case "auth/user-not-found":
        message = "⚠️ البريد أو كلمة المرور غير صحيحة"; break;
      case "auth/too-many-requests":
        message = "⚠️ محاولات كثيرة، حاول لاحقًا"; break;
      case "auth/network-request-failed":
        message = "⚠️ تحقق من الإنترنت"; break;
    }
    if (errBox) { errBox.textContent = message; errBox.style.display = "block"; }
  }
}

async function doLogout() {
  if (!confirm("هل تريد تسجيل الخروج؟")) return;
  await signOut(auth);
}

/* ===== Load ===== */
async function loadChannels() {
  if (!auth.currentUser) return;
  try {
    const snap = await getDocs(collection(db, "channels"));
    allChannels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allChannels.sort((a, b) => (a.order || 0) - (b.order || 0));
    renderStats();
    renderGrid();
  } catch (e) {
    console.error(e);
    toast("❌ خطأ في تحميل القنوات", true);
  }
}

function renderStats() {
  const cats = new Set(allChannels.map(c => c.category).filter(Boolean));
  $("stats").innerHTML = `
    <div class="stat"><div class="stat-value">${allChannels.length}</div><div class="stat-label">إجمالي القنوات</div></div>
    <div class="stat"><div class="stat-value">${cats.size}</div><div class="stat-label">التصنيفات</div></div>
  `;
}

function renderGrid() {
  const q = normalize($("adminSearch")?.value || "");
  const filtered = allChannels.filter(c =>
    !q || `${c.name || ''} ${c.category || ''}`.toLowerCase().includes(q)
  );

  const grid = $("channelsGrid");
  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <div>${allChannels.length ? 'لا توجد نتائج' : 'لا توجد قنوات بعد'}</div>
        <div style="font-size:0.85rem; margin-top:8px; color:#666;">اضغط "إضافة قناة جديدة" للبدء</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = filtered.map(c => {
    const logo = c.logo
      ? `<img class="channel-logo" src="${escapeHTML(c.logo)}" alt="" onerror="this.outerHTML='<div class=\\'channel-logo-placeholder\\'>📺</div>'">`
      : `<div class="channel-logo-placeholder">📺</div>`;
    return `
      <div class="channel-card">
        <div class="channel-head">
          ${logo}
          <div class="channel-info">
            <div class="channel-name">${escapeHTML(c.name || '-')}</div>
            <div class="channel-cat">${escapeHTML(c.category || 'عام')}</div>
          </div>
        </div>
        <div class="channel-url" title="${escapeHTML(c.url || '')}">${escapeHTML(c.url || '-')}</div>
        <div class="channel-actions">
          <button type="button" class="btn-mini btn-edit" data-action="edit" data-id="${escapeHTML(c.id)}">✏️ تعديل</button>
          <button type="button" class="btn-mini btn-del" data-action="delete" data-id="${escapeHTML(c.id)}">🗑️ حذف</button>
        </div>
      </div>
    `;
  }).join("");
}

/* ===== Form ===== */
function openForm(channel = null) {
  if (channel) {
    $("formTitle").textContent = "✏️ تعديل: " + (channel.name || "");
    setValue("editId", channel.id);
    setValue("f_name", channel.name);
    setValue("f_category", channel.category);
    setValue("f_url", channel.url);
    setValue("f_logo", channel.logo);
    setValue("f_order", channel.order || 0);
    setValue("f_notes", channel.notes);
  } else {
    $("formTitle").textContent = "➕ إضافة قناة جديدة";
    setValue("editId", "");
    setValue("f_name", "");
    setValue("f_category", "");
    setValue("f_url", "");
    setValue("f_logo", "");
    setValue("f_order", "0");
    setValue("f_notes", "");
  }
  $("formModal").classList.add("active");
}

function closeForm() { $("formModal").classList.remove("active"); }

function editChannel(id) {
  const ch = allChannels.find(x => x.id === id);
  if (!ch) { toast("❌ غير موجود", true); return; }
  openForm(ch);
}

async function saveChannel() {
  if (!auth.currentUser) { toast("❌ لازم تسجيل دخول", true); return; }
  const data = {
    name: value("f_name"),
    category: value("f_category") || "عام",
    url: value("f_url"),
    logo: value("f_logo"),
    order: Number(value("f_order")) || 0,
    notes: value("f_notes"),
    updatedAt: serverTimestamp()
  };
  const editId = value("editId");
  if (!data.name) { toast("⚠️ اسم القناة مطلوب", true); return; }
  if (!data.url) { toast("⚠️ رابط البث مطلوب", true); return; }
  if (!validURL(data.url)) { toast("⚠️ رابط البث غير صحيح", true); return; }
  if (data.logo && !validURL(data.logo)) { toast("⚠️ رابط الشعار غير صحيح", true); return; }

  try {
    if (editId) {
      await setDoc(doc(db, "channels", editId), data, { merge: true });
      toast("✓ تم التعديل");
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "channels"), data);
      toast("✓ تمت الإضافة");
    }
    closeForm();
    await loadChannels();
  } catch (e) {
    console.error(e);
    toast("❌ خطأ في الحفظ: " + e.message, true);
  }
}

async function deleteChannel(id) {
  if (!auth.currentUser) { toast("❌ لازم تسجيل دخول", true); return; }
  const ch = allChannels.find(x => x.id === id);
  if (!ch) return;
  if (!confirm(`⚠️ حذف "${ch.name}"؟\n\nلا يمكن التراجع.`)) return;
  try {
    await deleteDoc(doc(db, "channels", id));
    toast("✓ تم الحذف");
    await loadChannels();
  } catch (e) {
    toast("❌ خطأ في الحذف", true);
  }
}

/* ===== Events ===== */
$("loginBtn")?.addEventListener("click", doLogin);
$("logoutBtn")?.addEventListener("click", doLogout);
$("addBtn")?.addEventListener("click", () => openForm());
$("refreshBtn")?.addEventListener("click", loadChannels);
$("closeFormBtn")?.addEventListener("click", closeForm);
$("saveBtn")?.addEventListener("click", saveChannel);
$("loginPass")?.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("adminSearch")?.addEventListener("input", renderGrid);
$("channelsGrid")?.addEventListener("click", e => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === "edit") editChannel(id);
  if (btn.dataset.action === "delete") deleteChannel(id);
});
$("formModal")?.addEventListener("click", e => { if (e.target === $("formModal")) closeForm(); });
</script>

</body>
</html>
